groups:
  - name: gpu
    rules:
      # These XIDs (DBE, GSP and bus loss, uncontained ECC, recovery action) only clear with a reset or reboot.
      - alert: GpuXidNeedsHuman
        expr: >
          DCGM_FI_DEV_XID_ERRORS == 48
          or DCGM_FI_DEV_XID_ERRORS == 62
          or DCGM_FI_DEV_XID_ERRORS == 64
          or DCGM_FI_DEV_XID_ERRORS == 79
          or DCGM_FI_DEV_XID_ERRORS == 95
          or DCGM_FI_DEV_XID_ERRORS == 119
          or DCGM_FI_DEV_XID_ERRORS == 120
          or DCGM_FI_DEV_XID_ERRORS == 154
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "GPU {{ $labels.gpu }} XID {{ $value }}"
          description: "XID {{ $value }} on GPU {{ $labels.gpu }} needs a GPU reset or node reboot; check dmesg."

      - alert: GpuEccUncorrectable
        expr: increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL[10m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "GPU {{ $labels.gpu }} uncorrectable ECC error"
          description: "Double-bit ECC errors increased on GPU {{ $labels.gpu }} in the last 10m; drain jobs and reset the GPU."

      - alert: GpuRowRemapFailed
        expr: DCGM_FI_DEV_ROW_REMAP_FAILURE == 1
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "GPU {{ $labels.gpu }} row remap failed"
          description: "GPU {{ $labels.gpu }} has no spare rows left to remap; it needs RMA."

      - alert: GpuPcieReplayGrowing
        expr: increase(DCGM_FI_DEV_PCIE_REPLAY_COUNTER[15m]) > 100
        for: 0m
        labels:
          severity: warn
        annotations:
          summary: "GPU {{ $labels.gpu }} PCIe replays climbing"
          description: "More than 100 PCIe replays in 15m on GPU {{ $labels.gpu }}; reseat the card or check the riser."

      - alert: GpuHot
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "GPU {{ $labels.gpu }} at {{ $value }}C"
          description: "GPU {{ $labels.gpu }} core above 85C for 5m; check fans and inlet air."

      - alert: GpuMemoryHot
        expr: DCGM_FI_DEV_MEMORY_TEMP > 95
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "GPU {{ $labels.gpu }} memory at {{ $value }}C"
          description: "GPU {{ $labels.gpu }} memory above 95C for 5m; check fans and inlet air."

      - alert: GpuThermalThrottle
        expr: rate(DCGM_FI_DEV_THERMAL_VIOLATION[5m]) > 0
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "GPU {{ $labels.gpu }} thermally throttling"
          description: "GPU {{ $labels.gpu }} has been clocking down for heat for 10m; jobs are running slow."

      # Empty while the exporter is down; ExporterDown covers that case.
      - alert: GpuMissing
        expr: count(DCGM_FI_DEV_GPU_TEMP) < 8
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} of 8 GPUs visible to DCGM"
          description: "A GPU fell off the bus or out of DCGM; check nvidia-smi and dmesg for XID 79."

      # FB_USED is in MiB: memory held with no compute usually means a hung or orphaned process.
      - alert: GpuStuckJob
        expr: DCGM_FI_DEV_GPU_UTIL == 0 and DCGM_FI_DEV_FB_USED > 10000
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "GPU {{ $labels.gpu }} idle with memory allocated"
          description: "GPU {{ $labels.gpu }} has been at 0% util with over 10 GB allocated for 30m; find the process with nvidia-smi."

  - name: host
    rules:
      - alert: DiskAlmostFull
        expr: >
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.2
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.mountpoint }} below 20% free"
          description: "{{ $labels.mountpoint }} ({{ $labels.device }}) has had under 20% free space for 10m."

      # ignoring(state) because node_md_disks_required has no state label to match.
      - alert: RaidDegraded
        expr: node_md_disks_required - ignoring(state) node_md_disks{state="active"} > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "RAID {{ $labels.device }} degraded"
          description: "{{ $labels.device }} is missing {{ $value }} active disk(s); check /proc/mdstat."

      - alert: ExporterDown
        expr: up == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.job }} target down"
          description: "Prometheus cannot scrape {{ $labels.instance }} (job {{ $labels.job }}); its alerts are blind."
