services:
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.8.4
    restart: unless-stopped
    command: ["-f", "/etc/dcgm-exporter/counters.csv"]
    # Profiling fields (DCGM_FI_PROF_*) need SYS_ADMIN.
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./dcgm-counters.csv:/etc/dcgm-exporter/counters.csv:ro
    ports:
      - "127.0.0.1:9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command: ["--path.rootfs=/host"]
    # rslave so mounts made after startup, such as new disks, stay visible.
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    # Overriding the command drops image defaults, so the config and storage paths are restated.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/telegram_token:/run/secrets/telegram_token:ro
      # Silences survive restarts.
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [monitoring]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [monitoring]

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  monitoring:
