name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  queue:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/queue/requirements.txt
      - run: pip install -r deploy/queue/requirements.txt
      - run: pytest deploy/queue -q

  monitoring:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/monitoring
    steps:
      - uses: actions/checkout@v4
      - name: Compose file
        run: docker compose config -q
      - name: Prometheus config and rules
        run: |
          docker run --rm -v "$PWD":/m --entrypoint promtool prom/prometheus:v3.5.0 check config /m/prometheus.yml
          docker run --rm -v "$PWD":/m --entrypoint promtool prom/prometheus:v3.5.0 test rules /m/alerts.test.yml
      - name: Alertmanager config
        run: docker run --rm -v "$PWD":/m --entrypoint amtool prom/alertmanager:v0.28.1 check-config /m/alertmanager.yml
