wen3 перекладає</text><text x="240" y="115" font-family="K-body" font-size="15" fill="#DCD6F3" text-anchor="start" letter-spacing="0">бриф на EN і будує</text><text x="240" y="141" font-family="K-body" font-size="15" fill="#DCD6F3" text-anchor="start" letter-spacing="0">розкадровку</text><path d="M420.0,81 L427.0,88 L420.0,95" fill="none" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round"/><rect x="438" y="2" width="186" height="172" rx="18" fill="#0E0B1C" stroke="#2F2859" stroke-width="1.6"/><text x="458" y="32" font-family="K-mono" font-size="13" fill="#E0B75A" text-anchor="start" letter-spacing="1">03</text><text x="458" y="60" font-family="K-title" font-size="24" fill="#F5EFE6" text-anchor="start" letter-spacing="-0.3">Кадр</text><text x="458" y="89" font-family="K-body" font-size="15" fill="#DCD6F3" text-anchor="start" letter-spacing="0">Qwen-Image робить</text><text x="458" y="115" font-family="K-body" font-size="15" fill="#DCD6F3" text-anchor="start" letter-spacing="0">ключовий кадр</text><text x="458" y="141" font-family="K-body" font-size="15" fill="#DCD6F3" text-anchor="start" letter-spacing="0">9:16 · 1:1 · 16:9</text><path d="M638.0,81 L645.0,88 L638.0,95" fill="none" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round"/><rect x="656" y="2" width="186" height="172" rx="18" fill="#0E0B1C" stroke="#2F2859" stroke-width="1.6"/><text x="676" y="32" font-family="K-mono" font-size="13" fill="#E0B75A" text-anchor="start" letter-spacing="1">04</text><text x="676" y="60" font-family="K-title" font-size="24" fill="#F5EFE6" text-anchor="start" letter-spacing="-0.3">Відео</text><text x="676" y="89" font-family="K-body" font-size="15" fill="#DCD6F3" text-anchor="start" letter-spacing="0">Wan 2.2 + 4-step</text><text x="676" y="115" font-family="K-body" font-size="15" fill="#DCD6F3" text-anchor="start" letter-spacing="0">LoRA: 5-секундний</text><text x="676" y="141" font-family="K-body" font-size="15" fill="#DCD6F3" text-anchor="start" letter-spacing="0"